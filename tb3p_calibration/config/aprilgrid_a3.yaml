# Kalibr AprilGrid 타깃 (A3 가로 인쇄용, 시뮬레이션 보드와 실제 보드가 같음)
# 인쇄 보드 크기(바깥 모서리 사각형 포함): 가로 6 x 0.05 + 7 x 0.015 = 0.405 m, 세로 4 x 0.05 + 5 x 0.015 = 0.275 m
# A3(420 x 297 mm)에 실제 크기(100%)로 인쇄해야 함. 페이지 맞춤 금지
# 실제 단계에서는 인쇄 후 태그 크기를 캘리퍼스로 재서 tagSize를 실측값으로 교체 (R2)
target_type: 'aprilgrid'
tagCols: 6
tagRows: 4
tagSize: 0.05        # 태그 한 변 (m)
tagSpacing: 0.3      # 태그 사이 간격 / 태그 크기
