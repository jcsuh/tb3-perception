# tb3p 센서 캘리브레이션
#
# - 단위: 위치 m, 회전 rad (roll, pitch, yaw), 시간 s
# - xyz/rpy는 parent 링크 기준 child 링크의 위치와 방향 (URDF 조인트 origin과 같은 뜻)
# - time_offset: 센서 시각에 더해야 할 보정값 (W8-9 시간 오프셋 추정 결과가 들어감)
# - source: nominal(설계도 공칭값) | estimated(프로젝트 A 추정값)

source: nominal

sensors:
  imu:
    parent: base_link
    child: imu_link
    xyz: [-0.032, 0.0, 0.068]
    rpy: [0.0, 0.0, 0.0]
    time_offset: 0.0

  lidar:
    parent: base_link
    child: base_scan
    xyz: [-0.032, 0.0, 0.219]  # 새 판 윗면 0.1892 + 판 위 LiDAR 높이 0.0302 (burger_base.stl 기준)
    rpy: [0.0, 0.0, 0.0]
    time_offset: 0.0

  camera:
    parent: base_link
    child: camera_bottom_screw_frame   # D435i 바닥 삼각대 나사 구멍 = 브래킷 고정점
    xyz: [0.0502, 0.0, 0.1448]         # 뒷면이 판 끝보다 3 mm 앞, 브래킷 두께 3 mm (추정)
    rpy: [0.0, 0.0, 0.0]
    time_offset: 0.0

# 바퀴 (W7 UMBmark 추정 결과가 들어감)
# - radius_left/right: 바퀴 반지름 (m), separation: 두 바퀴 접지점 사이 간격 (m)
# - 오도메트리: 전진 = (r_R·Δφ_R + r_L·Δφ_L) / 2, 회전 = (r_R·Δφ_R - r_L·Δφ_L) / separation
wheels:
  radius_left: 0.033
  radius_right: 0.033
  separation: 0.160

# IMU 노이즈 (연속 시간, Kalibr 형식)
# - Gazebo는 샘플당 표준편차 σ = 노이즈 밀도 × √rate 로 환산해 사용 (xacro가 계산)
# - 랜덤 워크는 데이터시트에 없음 → 0 (Gazebo 미적용), 실제 단계 R1에서 Allan 분산으로 실측
imu_noise:
  base_imu:                         # OpenCR ICM-20648
    rate: 200                       # Hz
    gyro_noise_density: 2.618e-4    # rad/s/√Hz  (0.015 °/s/√Hz)
    accel_noise_density: 2.256e-3   # m/s²/√Hz   (230 µg/√Hz)
    gyro_random_walk: 0.0           # rad/s²/√Hz (미정)
    accel_random_walk: 0.0          # m/s³/√Hz   (미정)

  camera_imu:                       # D435i BMI055
    rate: 200
    gyro_noise_density: 2.443e-4    # 0.014 °/s/√Hz
    accel_noise_density: 1.471e-3   # 150 µg/√Hz
    gyro_random_walk: 0.0
    accel_random_walk: 0.0
