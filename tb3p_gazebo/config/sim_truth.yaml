# 시뮬레이션 정답 캘리브레이션 (Gazebo 로봇과 평가 도구 전용)
#
# 공칭값(tb3p_description/config/calibration.yaml)에서 일부러 조금씩 틀어 놓은 값.
# - Gazebo 속 로봇은 이 값대로 조립된다 (= 실제 로봇의 "진짜 조립 상태" 역할)
# - robot_state_publisher와 모든 추정기는 공칭값만 본다. 이 파일을 읽으면 안 된다.
# - 이 파일을 읽어도 되는 것은 평가 도구(tb3p_eval)뿐: 추정 결과를 채점하는 정답지
# - 실행 중에는 /truth/tf_static 으로도 발행된다
#
# 공칭값 대비 차이 (위치 mm, 회전 deg roll/pitch/yaw)
#   imu:    (+4, +3, +2)   (+0.5, -0.7, +1.0)
#   lidar:  (-3, +4, +4)   (+0.3, -0.2, +2.0)
#   camera: (+3, -6, +2)   (-1.0, +2.0, -1.5)
#
# 바퀴 (W7): 공칭 반지름 33.0 mm, 간격 160.0 mm 대비
#   왼쪽 반지름 33.10 mm (+0.30%), 오른쪽 33.00 mm (0), 간격 162.0 mm (+1.25%)
#   -> 좌우 지름 비 Ed = 오른쪽/왼쪽 = 0.99698, 평균 반지름 +0.15%, 간격 비 Eb = 1.0125
#   Gazebo의 바퀴 모양(충돌 원통 반지름, 바퀴 위치)만 이 값으로 바뀌고,
#   DiffDrive의 명령 변환과 /odom은 공칭값을 쓴다 (실제 로봇 펌웨어가 공칭값을 쓰는 것과 같음)

source: sim_truth

sensors:
  imu:
    parent: base_link
    child: imu_link
    xyz: [-0.028, 0.003, 0.070]
    rpy: [0.00873, -0.01222, 0.01745]
    time_offset: 0.0

  lidar:
    parent: base_link
    child: base_scan
    xyz: [-0.035, 0.004, 0.223]
    rpy: [0.00524, -0.00349, 0.03491]
    time_offset: 0.0

  camera:
    parent: base_link
    child: camera_bottom_screw_frame
    xyz: [0.0532, -0.006, 0.1468]
    rpy: [-0.01745, 0.03491, -0.02618]
    time_offset: 0.0

wheels:
  radius_left: 0.0331
  radius_right: 0.0330
  separation: 0.162

# IMU 노이즈 (연속 시간, Kalibr 형식)
# - Gazebo는 샘플당 표준편차 σ = 노이즈 밀도 × √rate 로 환산해 사용 (xacro가 계산)
# - 랜덤 워크는 데이터시트에 없음 → 0 (Gazebo 미적용), 실제 단계 R1에서 Allan 분산으로 실측
imu_noise:
  base_imu:                         # OpenCR ICM-20648
    rate: 200                       # Hz
    gyro_noise_density: 2.618e-4    # rad/s/√Hz  (0.015 °/s/√Hz)
    accel_noise_density: 2.256e-3   # m/s²/√Hz   (230 µg/√Hz)
    gyro_random_walk: 0.0           # rad/s²/√Hz (미정)
    accel_random_walk: 0.0          # m/s³/√Hz   (미정)

  camera_imu:                       # D435i BMI055
    rate: 200
    gyro_noise_density: 2.443e-4    # 0.014 °/s/√Hz
    accel_noise_density: 1.471e-3   # 150 µg/√Hz
    gyro_random_walk: 0.0
    accel_random_walk: 0.0
