name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dev image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev/Dockerfile
          tags: tb3p-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and test packages
        run: |
          docker run --rm -v "$PWD":/ws/src/tb3-perception tb3p-dev:ci \
            bash -c "source /opt/tb3_ws/install/setup.bash && colcon build && colcon test && colcon test-result --verbose"
